<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: cadetblue;
            color: aliceblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .name{
            font-size: 60px;
            color: darkblue;
            font-weight: bold;
            text-shadow: 4px 4px 6px black;
        }
        .tag{
            font-style: italic;
            color: darkviolet;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            color: blue;
            text-decoration: underline;
            text-shadow: 3px 3px 4px black;
        }
        .power{
            font-weight: bolder;
            text-transform: capitalize;
            color: darkgreen;
        }
        .weekness{
            text-decoration: line-through;
            color: lightgoldenrodyellow;
        }

    </style>
</head>
<body>
    <h1 class="name">Thunder kid
    </h1>
    <p class="tag">the most powerful hero in the school</p>
    <h2 class="label">
        Super powers
    </h2>
    <p class="power">
        can run faster then a cheater <br>
        can left the school bus 
    </p>
    <h3 class="label">
        weekness

    </h3>
    <p class="weekness">
        brocoli <br>
        homework
    </p>
</body>
</html>
